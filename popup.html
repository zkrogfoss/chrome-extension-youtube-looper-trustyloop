<!doctype html>
<html lang="en" data-brand="youtube">
<head>
<meta charset="utf-8">
<title>TrustyLoop for YouTube</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="popup.css">
<style>
  /* ~14px of space below the header line and above the switch (10px margin + the 4px grid gap), as for the main action in the other popups. */
  #controls { display: grid; margin: 10px 0; }
  #note { margin-top: 6px; } /* the notice sits ~10px under the header line instead of touching it */
  #controls[hidden] { display: none; }
  /* Main action: natural width, round icon, title and a status subline. Off: quiet icon; on: accent. */
  #loop { justify-self: start; display: flex; align-items: center; gap: 10px; padding: 0; border: 0; border-radius: 16px;
    background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
  #loop .dot { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: var(--soft); color: var(--muted); transition: transform .15s, background .15s, color .15s, box-shadow .25s; }
  /* While looping: accent fill plus a soft halo, so the state reads at a glance. */
  #loop[aria-checked="true"] .dot { background: var(--accent); color: var(--on-accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
  #loop:hover .dot { transform: scale(1.08); }
  #loop .dot svg { width: 15px; height: 15px; }
  #loop strong { display: block; font-size: 12px; font-weight: 600; line-height: 1.25; }
  #loop small { display: block; color: var(--muted); font-size: 10px; }

  /* A | B slides open below the loop button while looping (0fr→1fr animates the height). */
  .ab { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .25s ease, opacity .2s ease; }
  .ab.open { grid-template-rows: 1fr; opacity: 1; }
  .ab > div { overflow: hidden; min-height: 0; }
  @media (prefers-reduced-motion: reduce) { .ab { transition: none; } }
  .tiles { display: flex; gap: 8px; padding-top: 10px; }
  .tile { flex: 1; padding: 6px 10px; text-align: left; font: inherit; color: var(--fg); cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 10px; transition: background .15s; }
  .tile:hover { background: var(--soft); }
  .tile span { display: block; color: var(--muted); font-size: 10px; }
  .tile b { font: 600 12px ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; color: var(--muted); }
  .tile.set b { color: var(--fg); }
</style>
</head>
<body>
  <header>
    <h1>TrustyLoop for YouTube</h1>
    <button class="icon-btn" id="theme" type="button" title="Light or dark" aria-label="Switch light or dark theme">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <p id="note" role="status"></p>
  <div id="controls" hidden>
    <button id="loop" type="button" role="switch" aria-checked="false">
      <span class="dot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3M4 11v-1a4 4 0 0 1 4-4h12M7 21l-3-3 3-3M20 13v1a4 4 0 0 1-4 4H4"/></svg></span>
      <span><strong>Loop</strong><small id="hint">Play this video on repeat</small></span>
    </button>
    <div id="ab" class="ab">
      <div>
        <div class="tiles">
          <button id="a" class="tile" type="button" title="Start of the part to loop (current time)"><span>A · start</span><b id="ta">–:––</b></button>
          <button id="b" class="tile" type="button" title="End of the part to loop (current time)"><span>B · end</span><b id="tb">–:––</b></button>
        </div>
      </div>
    </div>
  </div>
  <label for="show">Show button under the video
    <span class="switch"><input id="show" type="checkbox" role="switch" aria-checked="true" checked><span class="track"></span></span>
  </label>
  <script type="module" src="popup.js"></script>
</body>
</html>
