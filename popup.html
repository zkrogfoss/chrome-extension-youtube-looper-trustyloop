<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="theme.js"></script>
  <style>
    :root {
      --bg: #ffffff; --fg: #18181b; --muted: #71717a; --line: #e4e4e7;
      --field: #f4f4f5; --accent: #4f46e5; --accent-fg: #ffffff;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #18181b; --fg: #fafafa; --muted: #a1a1aa; --line: #3f3f46;
      --field: #27272a; --accent: #818cf8; --accent-fg: #18181b;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px 16px 16px; width: 260px;
      background: var(--bg); color: var(--fg);
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    h1 { margin: 0; font-size: 13px; font-weight: 600; }
    button {
      font: inherit; color: inherit; cursor: pointer; background: transparent;
      border: 1px solid var(--line); border-radius: 10px; transition: background .15s, border-color .15s, color .15s;
    }
    button:hover { background: var(--field); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon { border: 0; padding: 4px; display: grid; place-items: center; color: var(--muted); }
    .icon:hover { color: var(--fg); background: transparent; }
    .icon svg { width: 16px; height: 16px; }
    :root[data-theme="dark"] .moon, :root[data-theme="light"] .sun { display: none; }

    #loop {
      width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-weight: 500;
    }
    #loop .glyph {
      width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; color: var(--muted); transition: color .15s;
    }
    #loop[aria-checked="true"] .glyph { color: var(--accent); }
    .track {
      margin-left: auto; width: 32px; height: 18px; border-radius: 9px; background: var(--line);
      position: relative; transition: background .2s;
    }
    .track::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
      border-radius: 50%; background: #fff; transition: transform .2s;
    }
    #loop[aria-checked="true"] .track { background: var(--accent); }
    #loop[aria-checked="true"] .track::after { transform: translateX(14px); }

    /* A | B slides open below the switch while looping (0fr→1fr animates the height). */
    .ab { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .25s ease, opacity .2s ease; }
    .ab.open { grid-template-rows: 1fr; opacity: 1; }
    .ab > div { overflow: hidden; min-height: 0; }
    @media (prefers-reduced-motion: reduce) { .ab { transition: none; } }
    .tiles { display: flex; gap: 8px; padding-top: 8px; }
    .tile { flex: 1; padding: 8px 10px; text-align: left; }
    .tile span { display: block; color: var(--muted); font-size: 11px; }
    .tile b { font: 600 15px ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; color: var(--muted); }
    .tile.set b { color: var(--fg); }
    .hint { margin: 8px 2px 0; color: var(--muted); font-size: 12px; }
    #note { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>TrustyLoop</h1>
    <button id="theme" class="icon" title="Switch theme" aria-label="Switch theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div id="note" hidden></div>
  <div id="controls" hidden>
    <button id="loop" role="switch" aria-checked="false">
      <svg class="glyph" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 11v-1a4 4 0 0 1 4-4h12M7 21l-3-3 3-3M20 13v1a4 4 0 0 1-4 4H4"/></svg>
      Loop
      <span class="track"></span>
    </button>
    <div id="ab" class="ab">
      <div>
        <div class="tiles">
          <button id="a" class="tile" title="Start of the part to loop (current time)"><span>A · start</span><b id="ta">–:––</b></button>
          <button id="b" class="tile" title="End of the part to loop (current time)"><span>B · end</span><b id="tb">–:––</b></button>
        </div>
        <p id="hint" class="hint"></p>
      </div>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
